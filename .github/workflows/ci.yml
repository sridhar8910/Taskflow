###############################################################################
# TaskFlow — Complete CI Pipeline
#
# Pipeline:  lint → test → security → build → deploy
#
# Triggers:  push to main/master, PRs to main/master
# Build/deploy only run on main/master pushes (not on PRs).
###############################################################################

name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read
  packages: write          # push to ghcr.io
  security-events: write   # upload SARIF from security scans

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# ─────────────────────────────────────────────────────────────────────────────
jobs:

  # ── Job 1: Lint ────────────────────────────────────────────────────────────
  lint:
    name: "Lint (ruff)"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ruff
        run: pip install ruff==0.4.4

      - name: Check formatting
        run: ruff format --check .

      - name: Check lint rules
        run: ruff check .

  # ── Job 2: Test ────────────────────────────────────────────────────────────
  test:
    name: "Test (pytest)"
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
          POSTGRES_DB: taskflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://taskflow:taskflow@localhost:5432/taskflow_test
      DATABASE_URL: postgresql+asyncpg://taskflow:taskflow@localhost:5432/taskflow_test
      SYNC_DATABASE_URL: postgresql+psycopg2://taskflow:taskflow@localhost:5432/taskflow_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-not-for-production-use-32chars
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      CACHE_TTL_SECONDS: "60"
      APP_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip and install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --tb=short \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-fail-under=70 \
            --junitxml=test-results.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          retention-days: 14

  # ── Job 3: Security ────────────────────────────────────────────────────────
  security:
    name: "Security Scan"
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies for audit
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"
          pip install pip-audit safety

      - name: Run pip-audit (dependency vulnerability scan)
        run: pip-audit --strict --desc 2>&1 || true
        # Non-blocking: log vulnerabilities but don't fail the build
        # Change `|| true` to strict failure once all deps are clean

      - name: Run safety check
        run: safety check 2>&1 || true

      - name: Lint Dockerfile with hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  # ── Job 4: Build & Push Docker Image ───────────────────────────────────────
  build:
    name: "Build & Push Docker Image"
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    timeout-minutes: 15

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build-push.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Print image details
        run: |
          echo "## Docker Image Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build-push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY

  # ── Job 5: Integration Smoke Test ──────────────────────────────────────────
  integration:
    name: "Integration Smoke Test"
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start full stack with Docker Compose
        run: |
          docker compose -f docker-compose.ci.yml up -d --build --wait
        env:
          SECRET_KEY: ci-integration-test-secret-key-32chars-long

      - name: Wait for API to be ready
        run: |
          echo "Waiting for API health check..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "API is healthy!"
              break
            fi
            echo "Attempt $i/30 — waiting 2s..."
            sleep 2
          done

      - name: Run smoke tests
        run: |
          chmod +x scripts/smoke-test.sh
          bash scripts/smoke-test.sh

      - name: Print Docker logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs --tail=100

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  # ── Job 6: Deploy to Render ────────────────────────────────────────────────
  deploy:
    name: "Deploy to Render"
    runs-on: ubuntu-latest
    needs: integration
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    timeout-minutes: 10
    environment: production    # requires manual approval in GitHub settings

    steps:
      - name: Trigger Render deploy hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "⚠️  RENDER_DEPLOY_HOOK_URL not set — skipping deployment."
            echo "Set this secret in GitHub repo settings to enable auto-deploy."
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## Deployment Skipped" >> $GITHUB_STEP_SUMMARY
            echo "Set \`RENDER_DEPLOY_HOOK_URL\` in repo secrets to enable." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          echo "Triggering Render deployment..."
          curl -sf "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            && echo "Render deploy hook triggered successfully." \
            || { echo "Failed to trigger Render deploy hook."; exit 1; }

      - name: Deployment summary
        run: |
          echo "## Deployment Triggered" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
