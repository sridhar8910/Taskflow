<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — Task Management</title>
  <meta name="description" content="TaskFlow: Manage projects, assign tasks, and receive smart notifications." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ── Auth Screen ──────────────────────────────────────────────────────────── -->
<div id="auth-screen" class="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
      </div>
      <span class="auth-logo-text">TaskFlow</span>
    </div>

    <!-- Tab switcher -->
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">Sign In</button>
      <button class="auth-tab" id="tab-signup" onclick="switchAuthTab('signup')">Sign Up</button>
    </div>

    <!-- Login Form -->
    <form id="login-form" class="auth-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label class="form-label">Email address</label>
        <input id="login-email" type="email" class="form-input" placeholder="name@company.com" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input id="login-password" type="password" class="form-input" placeholder="••••••••" required autocomplete="current-password" />
      </div>
      <div id="login-error" class="form-error hidden"></div>
      <button type="submit" class="btn btn-primary btn-full" id="login-btn">
        <span class="btn-text">Sign In</span>
        <span class="btn-spinner hidden"></span>
      </button>
    </form>

    <!-- Signup Form -->
    <form id="signup-form" class="auth-form hidden" onsubmit="handleSignup(event)">
      <div class="form-group">
        <label class="form-label">Email address</label>
        <input id="signup-email" type="email" class="form-input" placeholder="name@company.com" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input id="signup-password" type="password" class="form-input" placeholder="Min 8 characters" required minlength="8" autocomplete="new-password" />
      </div>
      <div id="signup-error" class="form-error hidden"></div>
      <button type="submit" class="btn btn-primary btn-full" id="signup-btn">
        <span class="btn-text">Create Account</span>
        <span class="btn-spinner hidden"></span>
      </button>
    </form>
  </div>
</div>

<!-- ── App Shell ────────────────────────────────────────────────────────────── -->
<div id="app-shell" class="app-shell hidden">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <a href="#dashboard" class="sidebar-logo" style="text-decoration: none;" onclick="window.location.hash='#dashboard'">
        <div class="sidebar-logo-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
        </div>
        <span class="sidebar-logo-text">TaskFlow</span>
      </a>
      <button class="sidebar-toggle" id="sidebar-toggle" onclick="toggleSidebar()">☰</button>
    </div>

    <nav class="sidebar-nav">
      <div class="sidebar-section-label">Workspace</div>
      <a href="#dashboard" class="nav-item" data-page="dashboard" id="nav-dashboard">
        <span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></span>
        <span class="nav-label">Overview</span>
      </a>
      <a href="#tasks" class="nav-item" data-page="tasks" id="nav-tasks">
        <span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg></span>
        <span class="nav-label">My Tasks</span>
      </a>
      <a href="#projects" class="nav-item" data-page="projects" id="nav-projects">
        <span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg></span>
        <span class="nav-label">Projects</span>
      </a>
      <a href="#notifications" class="nav-item" data-page="notifications" id="nav-notifications">
        <span class="nav-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg></span>
        <span class="nav-label">Notifications</span>
        <span class="nav-badge hidden" id="notif-badge">0</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-info" id="user-info">
        <div class="user-avatar" id="user-avatar">U</div>
        <span class="user-email truncate" id="user-email">user@example.com</span>
      </div>
      <button class="btn-logout" onclick="logout()" title="Sign out"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg></button>
    </div>
  </aside>

  <!-- Main content -->
  <main class="main-content" id="main-content">
    <div id="page-content"></div>
  </main>
</div>

<!-- ── Global Modal ─────────────────────────────────────────────────────────── -->
<div id="modal-overlay" class="modal-overlay hidden" onclick="closeModal(event)">
  <div class="modal" id="modal-box">
    <div class="modal-header">
      <h3 class="modal-title" id="modal-title">Modal</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<!-- ── Toast Notifications ──────────────────────────────────────────────────── -->
<div id="toast-container" class="toast-container"></div>

<script src="app.js"></script>
</body>
</html>
